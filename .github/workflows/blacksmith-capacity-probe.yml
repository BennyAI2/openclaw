name: Blacksmith Capacity Probe

on:
  push:
    branches:
      - codex/blacksmith-runner-capacity-probe
    paths:
      - .github/workflows/blacksmith-capacity-probe.yml

permissions: {}

concurrency:
  group: blacksmith-capacity-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    if: github.repository == 'openclaw/openclaw'
    name: Capacity (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - runner: blacksmith-2vcpu-ubuntu-2404
            cpus: 2
          - runner: blacksmith-4vcpu-ubuntu-2404
            cpus: 4
          - runner: blacksmith-8vcpu-ubuntu-2404
            cpus: 8
          - runner: blacksmith-16vcpu-ubuntu-2404
            cpus: 16
          - runner: blacksmith-32vcpu-ubuntu-2404
            cpus: 32
          - runner: ubuntu-24.04
            cpus: 4
    steps:
      - name: Measure guest capacity and CPU limits
        env:
          PROBE_LABEL: ${{ matrix.runner }}
          PROBE_CPUS: ${{ matrix.cpus }}
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import datetime
          import json
          import multiprocessing
          import os
          import pathlib
          import re
          import shutil
          import subprocess
          import time


          def read_text(path):
              try:
                  return pathlib.Path(path).read_text()[:4096].strip()
              except OSError as error:
                  return {"unavailable": type(error).__name__}


          def command(args):
              if not shutil.which(args[0]):
                  return {"unavailable": "not installed"}
              result = subprocess.run(args, capture_output=True, text=True, timeout=10)
              return {"exit_code": result.returncode, "stdout": result.stdout[:8192].strip(), "stderr": result.stderr[:512].strip()}


          def unescape_mount(value):
              return re.sub(r"\\([0-7]{3})", lambda match: chr(int(match.group(1), 8)), value)


          def cgroup_paths():
              mounts = []
              for line in pathlib.Path("/proc/self/mountinfo").read_text().splitlines():
                  left, right = line.split(" - ", 1)
                  fields, attributes = left.split(), right.split()
                  if attributes[0] not in ("cgroup", "cgroup2"):
                      continue
                  mounts.append((unescape_mount(fields[3]), unescape_mount(fields[4]), attributes))
              paths = []
              for line in pathlib.Path("/proc/self/cgroup").read_text().splitlines():
                  _, controllers, group = line.split(":", 2)
                  for root, mount, attributes in mounts:
                      unified = attributes[0] == "cgroup2"
                      if unified != (controllers == ""):
                          continue
                      if not unified and not set(controllers.split(",")) & set(attributes[2].split(",")):
                          continue
                      group_path, root_path, mount_path = pathlib.Path(group), pathlib.Path(root), pathlib.Path(mount)
                      if group_path.is_relative_to(root_path):
                          leaf = mount_path / group_path.relative_to(root_path)
                      elif group == "/":
                          leaf = mount_path
                      else:
                          paths.append({"controllers": controllers, "group": group, "mount_root": root, "unresolved": True})
                          continue
                      current = leaf
                      while current.is_relative_to(mount_path):
                          paths.append({"controllers": controllers or "unified", "path": str(current), "leaf": current == leaf})
                          if current == mount_path:
                              break
                          current = current.parent
              return paths


          CGROUP_PATHS = cgroup_paths()
          LIMIT_FILES = (
              "cpu.max", "cpu.max.burst", "cpu.stat", "cpu.weight", "cpuset.cpus", "cpuset.cpus.effective",
              "memory.max", "memory.high", "memory.current", "memory.events", "cpu.cfs_quota_us",
              "cpu.cfs_period_us", "cpuacct.usage", "cpuset.effective_cpus", "memory.limit_in_bytes",
              "memory.usage_in_bytes", "memory.failcnt",
          )


          def limits():
              result = []
              for entry in CGROUP_PATHS:
                  values = dict(entry)
                  if "path" in entry:
                      directory = pathlib.Path(entry["path"])
                      values["values"] = {name: read_text(directory / name) for name in LIMIT_FILES if (directory / name).exists()}
                  result.append(values)
              return result


          def snapshot():
              cpu = pathlib.Path("/proc/stat").read_text().splitlines()[0].split()[1:]
              names = ("user", "nice", "system", "idle", "iowait", "irq", "softirq", "steal", "guest", "guest_nice")
              return {"cgroups": limits(), "cpu_pressure": read_text("/proc/pressure/cpu"), "cpu_ticks": dict(zip(names, map(int, cpu)))}


          def burn(ready, start, output):
              ready.put(True)
              start.wait()
              cpu_started = time.process_time()
              deadline = time.monotonic() + 4
              operations, value = 0, 1
              while time.monotonic() < deadline:
                  for _ in range(10000):
                      value = (value * 1664525 + 1013904223) & 0xFFFFFFFF
                  operations += 10000
              output.put({"cpu_seconds": time.process_time() - cpu_started, "operations": operations, "checksum": value})


          def measure(workers):
              context = multiprocessing.get_context("fork")
              ready, output, start = context.Queue(), context.Queue(), context.Event()
              processes = [context.Process(target=burn, args=(ready, start, output)) for _ in range(workers)]
              before = snapshot()
              try:
                  for process in processes:
                      process.start()
                  for _ in processes:
                      ready.get(timeout=15)
                  started = time.monotonic()
                  start.set()
                  observations = [output.get(timeout=20) for _ in processes]
                  for process in processes:
                      process.join(timeout=5)
                      if process.exitcode != 0:
                          raise RuntimeError("CPU probe worker did not exit successfully")
                  wall = time.monotonic() - started
                  cpu = sum(item["cpu_seconds"] for item in observations)
                  return {
                      "workers": workers, "wall_seconds": wall, "cpu_seconds": cpu,
                      "effective_cpu_parallelism": cpu / wall,
                      "operations_per_second": sum(item["operations"] for item in observations) / wall,
                      "before": before, "after": snapshot(),
                  }
              finally:
                  for process in processes:
                      if process.is_alive():
                          process.terminate()
                          process.join(timeout=5)
                  for queue in (ready, output):
                      queue.close()
                      queue.join_thread()


          requested = int(os.environ["PROBE_CPUS"])
          if requested not in (2, 4, 8, 16, 32):
              raise ValueError("Unexpected probe size")
          status = dict(line.split(":", 1) for line in pathlib.Path("/proc/self/status").read_text().splitlines())
          meminfo = dict(line.split(":", 1) for line in pathlib.Path("/proc/meminfo").read_text().splitlines())
          memory_bytes = int(meminfo["MemTotal"].split()[0]) * 1024
          affinity = sorted(os.sched_getaffinity(0))
          report = {
              "requested_label": os.environ["PROBE_LABEL"], "requested_cpus": requested,
              "workflow_sha": os.environ["GITHUB_SHA"], "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "observed_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "kernel": {"release": os.uname().release, "machine": os.uname().machine},
              "python": command(["python3", "--version"]),
              "os_cpu_count": os.cpu_count(), "affinity_cpus": affinity, "affinity_cpu_count": len(affinity),
              "memory_total_bytes": memory_bytes, "memory_total_gib": memory_bytes / (1024 ** 3),
              "online_cpus": read_text("/sys/devices/system/cpu/online"),
              "present_cpus": read_text("/sys/devices/system/cpu/present"),
              "nproc": command(["nproc"]), "nproc_all": command(["nproc", "--all"]),
              "getconf_online": command(["getconf", "_NPROCESSORS_ONLN"]),
              "lscpu": command(["lscpu", "--json"]),
              "process_allowed_cpus": status["Cpus_allowed_list"].strip(),
              "process_allowed_memory_nodes": status["Mems_allowed_list"].strip(),
              "node_resources": command(["node", "-e", "const o=require('node:os');console.log(JSON.stringify({version:process.version,availableParallelism:o.availableParallelism(),cpuCount:o.cpus().length,totalmem:o.totalmem()}))"]),
              "resource_limits": limits(), "single_worker": measure(1), "requested_workers": measure(requested),
          }
          report["throughput_speedup"] = report["requested_workers"]["operations_per_second"] / report["single_worker"]["operations_per_second"]
          print("BLACKSMITH_CAPACITY_PROBE_BEGIN", flush=True)
          print(json.dumps(report, indent=2, sort_keys=True), flush=True)
          print("BLACKSMITH_CAPACITY_PROBE_END", flush=True)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## " + report["requested_label"] + "\n\n")
              summary.write("| Metric | Observed |\n| --- | --- |\n")
              summary.write(f"| Requested CPUs | {requested} |\n")
              summary.write(f"| OS CPUs / affinity CPUs | {report['os_cpu_count']} / {len(affinity)} |\n")
              summary.write(f"| Guest memory | {report['memory_total_gib']:.2f} GiB |\n")
              summary.write(f"| CPU seconds / wall second, {requested} workers | {report['requested_workers']['effective_cpu_parallelism']:.2f} |\n")
              summary.write(f"| Throughput versus one worker | {report['throughput_speedup']:.2f}x |\n")
          PYTHON
