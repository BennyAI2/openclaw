name: Windows npm link diagnostic

on:
  push:
    branches: [steipete/npm-windows-link-probe]

permissions:
  contents: read

jobs:
  links:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
      - name: Compare nested directory links with native module loading
        shell: pwsh
        run: |
          $source = @'
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import {spawnSync} from 'node:child_process';
          const results=[];
          for (const hostLink of ['relative','absolute']) {
            const root=fs.mkdtempSync(path.join(os.tmpdir(),'openclaw-link-probe-'));
            const source=path.join(root,'extensions','probe');
            const output=path.join(root,'dist','extensions','probe');
            const sourceModules=path.join(source,'node_modules');
            const stagedModules=path.join(output,'node_modules');
            const redact=value=>String(value).replaceAll(root,'<fixture>').replaceAll(root.replaceAll('\\','/'),'<fixture>');
            const attempt=fn=>{try{return fn();}catch(error){return {code:error.code,message:redact(error.message)};}};
            try {
              fs.mkdirSync(sourceModules,{recursive:true});
              fs.mkdirSync(output,{recursive:true});
              fs.mkdirSync(path.join(root,'dist','plugin-sdk'),{recursive:true});
              fs.writeFileSync(path.join(root,'package.json'),JSON.stringify({name:'openclaw',type:'module',exports:{'./plugin-sdk/probe':'./dist/plugin-sdk/probe.js'}}));
              fs.writeFileSync(path.join(root,'dist','plugin-sdk','probe.js'),'export const marker="HOST";\n');
              for(const dir of [source,output]) fs.writeFileSync(path.join(dir,'package.json'),JSON.stringify({name:'@openclaw/probe',type:'module'}));
              const link=path.join(sourceModules,'openclaw');
              fs.symlinkSync(hostLink==='relative'?path.relative(sourceModules,root):root,link,hostLink==='relative'?'dir':'junction');
              fs.symlinkSync(sourceModules,stagedModules,'junction');
              const stagedHost=path.join(stagedModules,'openclaw');
              const result={hostLink,node:process.version,platform:process.platform,arch:process.arch,
                sourceTarget:attempt(()=>redact(fs.readlinkSync(link))),
                outerTarget:attempt(()=>redact(fs.readlinkSync(stagedModules))),
                javascriptRealpath:attempt(()=>path.relative(root,fs.realpathSync(stagedHost))||'.'),
                nativeRealpath:attempt(()=>path.relative(root,fs.realpathSync.native(stagedHost))||'.'),
                stagedExports:attempt(()=>JSON.parse(fs.readFileSync(path.join(stagedHost,'package.json'),'utf8')).exports)};
              for(const [kind,extension,sourceText] of [
                ['esm','mjs','import {marker} from "openclaw/plugin-sdk/probe"; console.log(marker);'],
                ['cjs','cjs','console.log(require("openclaw/plugin-sdk/probe").marker);']]) {
                const file=path.join(output,`entry.${extension}`);
                fs.writeFileSync(file,sourceText);
                const child=spawnSync(process.execPath,[file],{encoding:'utf8',timeout:15000});
                result[kind]={exitCode:child.status,stdout:redact(child.stdout),stderr:redact(child.stderr),error:child.error?.code};
              }
              results.push(result);
            } catch(error) {
              results.push({hostLink,node:process.version,platform:process.platform,error:attempt(()=>{throw error;})});
            } finally {
              fs.rmSync(root,{recursive:true,force:true});
            }
          }
          console.log(JSON.stringify(results,null,2));
          '@
          $source | node --input-type=module
          exit $LASTEXITCODE
