name: Release advisory retrieval diagnostic
run-name: Release advisory retrieval diagnostic 2026.8.2
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  advisory_diagnostic:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Read thirteen public advisories with the preflight token policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          const ids = ["GHSA-p7fg-763f-g4gf", "GHSA-crvj-82cr-hjcx", "GHSA-g6gw-c38x-mqfc", "GHSA-gqvv-2mrq-wpjv", "GHSA-m732-5p4w-x69g", "GHSA-xh87-mx6m-69f3", "GHSA-2vr4-cq9g-pvrc", "GHSA-rpw4-54j3-4h4q", "GHSA-2883-xcg3-v3hh", "GHSA-4mjr-xmp4-gh2g", "GHSA-x5fp-wj9c-mxmx", "GHSA-45c6-75p6-83cc", "GHSA-8r6m-32jq-jx6q"];
          const headerNames = ['x-ratelimit-limit', 'x-ratelimit-remaining', 'x-ratelimit-reset', 'x-ratelimit-resource', 'x-ratelimit-used', 'retry-after', 'x-github-request-id', 'x-github-api-version-selected'];
          const results = [];
          for (const id of ids) {
            const started = Date.now();
            const result = { id };
            try {
              const response = await fetch(`https://api.github.com/advisories/${id}`, {
                headers: { accept: 'application/json', 'x-github-api-version': '2022-11-28', authorization: `Bearer ${process.env.GH_TOKEN}` },
                signal: AbortSignal.timeout(15000),
                redirect: 'manual',
              });
              result.status = response.status;
              const location = response.headers.get('location');
              if (location) {
                const destination = new URL(location, response.url);
                result.redirectLocation = destination.origin + destination.pathname;
              }
              result.headers = Object.fromEntries(headerNames.map(name => [name, response.headers.get(name)]));
              const chunks = [];
              let length = 0;
              for await (const chunk of response.body) {
                length += chunk.byteLength;
                if (length > 2 * 1024 * 1024) throw new RangeError('response-bound');
                chunks.push(chunk);
              }
              const body = JSON.parse(Buffer.concat(chunks).toString('utf8'));
              // Keep only public advisory fields and the bounded error category, never request headers.
              result.advisory = Object.fromEntries(['ghsa_id', 'type', 'published_at', 'github_reviewed_at', 'withdrawn_at'].map(key => [key, body[key] ?? null]));
              result.advisory.vulnerabilities = (Array.isArray(body.vulnerabilities) ? body.vulnerabilities : []).slice(0, 20).map(item => ({ package: item.package, vulnerable_version_range: item.vulnerable_version_range }));
              result.errorMessage = typeof body.message === 'string' ? body.message.replaceAll(process.env.GH_TOKEN, '[redacted]').slice(0, 500) : null;
            } catch (error) {
              result.error = { name: error.name, code: typeof error.cause?.code === 'string' ? error.cause.code : null };
            }
            result.elapsedMs = Date.now() - started;
            results.push(result);
          }
          await writeFile('advisory-diagnostic.json', JSON.stringify({ diagnosticOnly: true, runId: process.env.GITHUB_RUN_ID, workflowSha: process.env.GITHUB_SHA, node: process.version, results }, null, 2) + '\n');
          console.log(JSON.stringify(results.map(({id, status, error}) => ({id, status, error}))));
          NODE
      - name: Retain sanitized diagnostic evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-advisory-retrieval-diagnostic-${{ github.run_id }}
          path: advisory-diagnostic.json
          if-no-files-found: error
          retention-days: 14
