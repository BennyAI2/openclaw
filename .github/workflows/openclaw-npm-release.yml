name: Release advisory retrieval diagnostic
run-name: Fixed release advisory scanner diagnostic 2026.8.2
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  advisory_diagnostic:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions/setup-pnpm-store-cache
            .github/release/advisory-diagnostic
            scripts/lib
            scripts/pre-commit
            src/utils
            packages/normalization-core
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - uses: ./.github/actions/setup-pnpm-store-cache
        with:
          node-version: 24.19.0
          cache-mode: off
      - name: Install the frozen scanner runtime in an isolated prefix
        run: |
          set -euo pipefail
          runtime_dir="$RUNNER_TEMP/advisory-scanner-runtime"
          mkdir -p "$runtime_dir"
          cp .github/release/advisory-diagnostic/package.json .github/release/advisory-diagnostic/pnpm-lock.yaml "$runtime_dir/"
          pnpm --dir "$runtime_dir" install --frozen-lockfile --ignore-scripts
          ln -s "$runtime_dir/node_modules" node_modules
      - name: Run the fixed scanner through real registry and GitHub requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --import tsx .github/release/advisory-diagnostic/scanner-proof.mts
      - name: Retain sanitized diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fixed-release-advisory-scanner-diagnostic-${{ github.run_id }}
          path: scanner-diagnostic.json
          if-no-files-found: error
          retention-days: 14
